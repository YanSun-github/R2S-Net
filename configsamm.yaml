dataset: "cas(me)2" # "cas(me)^2"
cas(me)2:
  dataset: "cas(me)2"
  # dataset statistics & training configuration
  RATIO_SCALE: 1
  SEGMENT_LENTH: 256
  RECEPTIVE_FILED: 15
  save_model: True
  save_intervals: 1   # save ckpt for every epoch
  micro_average_len: 15
  macro_average_len: 59
  micro_max: 80
  micro_min: 15 #8-16
  macro_max: 90 #16 117
  macro_min: 15
  epoch_begin: 1
  nms_top_K_micro: 2
  nms_top_K_macro: 5
  RAB_args: {'layer_num': 2, 'drop_out': 0.3, 'num_heads': 8, 'dim_feedforward': 128}
  micro_left_min_dis: 13  # micro_min // 2
  micro_left_max_dis: 60
  micro_right_min_dis: 13
  micro_right_max_dis: 60

  macro_left_min_dis: 7
  macro_left_max_dis: 29
  macro_right_min_dis: 7  # macro_min // 2
  macro_right_max_dis: 29
#"/data/DataSets/AUW-gcn/features/cas(me)^2/feature_segment256"
  project_root: "./"
  feature_root: ~
  segment_feat_root: "/data/DataSets/CASME2pro/feature_segment/"#"/data/DataSets/AUW-gcn/features/cas(me)^2/feature_segment" #"/data/DataSets/cas(me)^2/feature_segment10"
  model_save_root: ~
  output_dir_name: ~
  anno_csv: "/code/CodeTest/wzl/AUW-GCN/update_CASME2.csv"
  num_workers: 2
  device: 'cuda:0'


  abfcm_training_lr: 0.01
  abfcm_weight_decay: 0.1
  abfcm_lr_scheduler: 0.96
  abfcm_apex_gamma: 1
  abfcm_apex_alpha: 0.90
  abfcm_action_gamma: 1
  abfcm_action_alpha: 0.80
  abfcm_start_end_gama: 1
  abfcm_start_end_alpha: 0.90
  abfcm_label_smooth: 0.16
  abfcm_best_epoch: 47

  micro_apex_score_threshold: 0.45
  macro_apex_score_threshold: 0.45

  epochs: 100
  batch_size: 128

  verbose: False

  macro_ration: 0.5 # balance micro and macro
  micro_normal_range: 1
  macro_normal_range: 3

  subject_list: [
      "casme_016","casme_015","casme_019","casme_020","casme_021",
      "casme_022","casme_023","casme_024","casme_025","casme_026",
      "casme_027","casme_029","casme_030","casme_031","casme_032",
      "casme_033","casme_034","casme_035","casme_036","casme_037",
      "casme_038","casme_040"
  ]
